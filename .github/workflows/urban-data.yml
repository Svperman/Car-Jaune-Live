# Car Jaune Live — horaires des réseaux urbains (Citalis, Kar'Ouest, Alternéo, Car'Sud, Estival)
# Chaque lundi (et à la demande), télécharge les horaires officiels sur transport.data.gouv.fr,
# les compacte dans data/urbain/ et republie l'appli si quelque chose a changé.

name: Mettre à jour les réseaux urbains

on:
  schedule:
    - cron: '17 1 * * 1'          # lundi 5 h 17 heure de La Réunion
  push:
    branches: [main]
    paths: ['tools/build-urban.mjs', '.github/workflows/urban-data.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: urban-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Télécharger et compacter les horaires
        run: |
          npm init -y >/dev/null
          npm install --no-save fflate@0.8.2
          node tools/build-urban.mjs
      - name: Enregistrer et republier si changement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/urbain
          # seul l'horodatage a changé ? on ne republie pas
          if git diff --cached --quiet -- 'data/urbain/*.json' ':!data/urbain/index.json' && git ls-files --error-unmatch data/urbain/index.json >/dev/null 2>&1; then
            echo "Horaires identiques : rien à republier"; exit 0
          fi
          git config user.name "car-jaune-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Réseaux urbains : horaires mis à jour ($(date -u +%Y-%m-%d))"
          git push
          gh workflow run test-and-publish.yml --ref main
