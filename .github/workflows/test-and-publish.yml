# Car Jaune Live — test automatique puis publication sur GitHub Pages.
# Si le test trouve une erreur, la version en ligne N'EST PAS remplacée (ton appli continue de marcher).
#
# Réglage unique : Settings → Pages → Build and deployment → Source : « GitHub Actions ».

name: Tester et publier l'appli

on:
  push:
    branches: [main]
    paths-ignore: ['apps-script/**', 'android/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer le navigateur de test
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.48.2 html-minifier-terser@7.2.0
          npx playwright install --with-deps chromium
      - name: Tester l'appli (téléphone + ordinateur)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/smoke.mjs
          node tests/scenarios.mjs
          node tests/horsligne.mjs
          node tests/proches-sms.mjs
          node tests/utilisateur.mjs
          node tests/ecrans.mjs
          node tests/retour.mjs
          node tests/detection.mjs
          node tests/zoom.mjs
          node tests/deplacement.mjs
          node tests/ou-campus.mjs
          node tests/trafic-alertes.mjs
          node tests/voyageurs.mjs
          node tests/messages.mjs
          node tests/lisible.mjs
          node tests/maj.mjs
          node tests/batterie.mjs
          node tests/accessibilite.mjs
          node tests/voyage.mjs
          node tests/plus.mjs
          node tests/anglais.mjs
          node tests/tout.mjs
          node tests/journaux.mjs
      - name: Préparer la version publiée (compressée, plus rapide à ouvrir)
        run: |
          mkdir -p _site
          cp -r manifest.webmanifest sw.js icons lib _site/
          sed -i "s/'__BUILD__'/'${GITHUB_SHA::7}'/" index.html     # numéro de version : les téléphones voient qu'il y a du nouveau
          printf '{"b":"%s"}' "${GITHUB_SHA::7}" > _site/version.json   # petit fichier lu par les téléphones pour savoir s'il y a du nouveau
          npx html-minifier-terser --collapse-whitespace --conservative-collapse --remove-comments \
            --minify-css true --minify-js true index.html -o _site/index.html
          echo "index.html : $(wc -c < index.html) → $(wc -c < _site/index.html) octets"
      - name: Tester aussi la version compressée
        run: |
          cp -r tests _site/
          (cd _site && python3 -m http.server 8766 >/dev/null 2>&1 &)
          sleep 2
          cd _site
          BASE=http://localhost:8766 node ../tests/smoke.mjs
          rm -rf tests _test.html test-*.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Captures d'écran du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: test-*.png
          if-no-files-found: ignore

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
