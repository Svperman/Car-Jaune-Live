# Car Jaune Live — construction de l'appli Android (APK) avec position en arrière-plan.
# L'APK affiche l'appli en ligne (svperman.github.io/Car-Jaune-Live) : les mises à jour du site arrivent
# toutes seules, sans réinstaller. On ne reconstruit l'APK que si la partie Android change.
#
# Résultat : https://github.com/Svperman/Car-Jaune-Live/releases/tag/android  → car-jaune.apk

name: Construire l'APK Android

on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml', 'icons/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Préparer le projet Android (Capacitor)
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../car-jaune.apk

      - uses: actions/upload-artifact@v4
        with:
          name: car-jaune-apk
          path: car-jaune.apk

      - name: Publier l'APK (lien fixe à télécharger sur le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Car Jaune Live — appli Android
          prerelease: false
          make_latest: true
          body: |
            📲 **Installer sur Android** : télécharge `car-jaune.apk` ci-dessous depuis ton téléphone, ouvre-le,
            autorise « Installer des applis inconnues » si Android le demande, puis Installer.

            Cette appli permet de **partager ta position avec tes proches même appli fermée**
            (une notification « Partage de position » reste affichée pendant le partage).
            Le reste de l'appli se met à jour tout seul depuis le site.
          files: car-jaune.apk
